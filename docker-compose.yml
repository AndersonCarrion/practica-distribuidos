networks:
  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.0.0/16

services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    environment:
      - MAQUINA1_IP=${MAQUINA1_IP}
      - MAQUINA2_IP=${MAQUINA2_IP}
      - MAQUINA3_IP=${MAQUINA3_IP}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app_net

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - NODE_NAME=${NODE_NAME}
      - JWT_SECRET=${JWT_SECRET}
      # Backend conecta a MongoDB por DNS interno de Docker (siempre funciona)
      - MONGO_URI=mongodb://mongo:27017/muraltech?replicaSet=rs0
      # Lista de IPs reales para rs.initiate() (MongoDB-to-MongoDB)
      - REPLICA_MEMBERS=${MAQUINA1_IP}:27017,${MAQUINA2_IP}:27017,${MAQUINA3_IP}:27017
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - app_net

  mongo:
    image: mongo:7.0
    hostname: mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    extra_hosts:
      # Mapea la IP PROPIA de esta máquina a la IP fija del container en app_net
      # Así MongoDB puede alcanzarse a sí mismo por su IP pública (necesario para replica set)
      - "${MY_IP}:10.200.0.10"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      app_net:
        ipv4_address: 10.200.0.10

volumes:
  mongo_data:
