services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    environment:
      - MAQUINA1_IP=${MAQUINA1_IP}
      - MAQUINA2_IP=${MAQUINA2_IP}
      - MAQUINA3_IP=${MAQUINA3_IP}
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - NODE_NAME=${NODE_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - MONGO_URI=mongodb://${MAQUINA1_IP}:27017,${MAQUINA2_IP}:27017,${MAQUINA3_IP}:27017/muraltech?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/uploads

  mongo:
    image: mongo:7.0
    hostname: ${MAQUINA1_IP}
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    extra_hosts:
      - "${MAQUINA1_IP}:172.18.0.2"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    # Ajuste de identación estricta para solucionar el error de mapping:
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  mongo_data: